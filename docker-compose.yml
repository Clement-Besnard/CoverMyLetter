services:
  mongodb:
    image: mongo:latest
    container_name: covermyletter-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mongosh", "-u", "admin", "-p", "password", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  langflow:
    image: langflowai/langflow:1.4.3
    container_name: covermyletter-langflow
    user: root
    ports:
      - "7860:7860"
    environment:
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_LOAD_FLOWS_PATH=/app/flows
      - LANGFLOW_LOAD_FLOWS_OVERWRITE_ON_NAME_MATCH=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - langflow_data:/app/langflow
      - ./langflow/flows:/app/flows:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build: ./backend
    container_name: covermyletter-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/covermyletter?authSource=admin
      - LANGFLOW_BASE_URL=http://langflow:7860
      - PORT=3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      langflow:
        condition: service_healthy

  frontend:
    build: .
    container_name: covermyletter-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data:
  langflow_data:
